name: Data Solution CI-CD Pipeline (Pacifico DevSecOps)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── FASE 1: CALIDAD Y SEGURIDAD EN CÓDIGO DE DATOS (SHIFT-LEFT) ───
  security-and-lint:
    name: Code Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar entorno Python para PySpark
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Escaneo de secretos en el código (Secret Scanning)
        uses: trufflesecurity/trufflehog-main-action@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}

      - name: Escaneo de dependencias Python (SCA - Safety / Snyk)
        run: |
          pip install safety
          # Verifica si existen CVEs conocidos en las librerías del ETL de datos
          safety check || echo "Advertencia de vulnerabilidad en dependencias de datos"

  # ─── FASE 2: DESPLIEGUE DE INFRAESTRUCTURA DE DATOS (TERRAFORM) ───
  deploy-infrastructure:
    name: Deploy Data Infrastructure (IaC)
    needs: security-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init & Apply (Azure SQL / Storage)
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          cd terraform/modules/database
          terraform init
          # terraform apply -auto-approve (Desactivado para demo segura)

  # ─── FASE 3: DESPLIEGUE DE ARTEFACTOS DE DATABRICKS / SQL ───
  deploy-data-artifacts:
    name: Deploy Notebooks & Databricks Bundles
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Sincronización de Notebooks / DABs hacia Databricks Workspace
        run: |
          echo "Simulando: databricks bundle deploy --target prod"
          echo "Notebooks y Jobs de Databricks actualizados exitosamente en la nube."